[package]
name = "rust_lib_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = "0.22.1"
flutter_rust_bridge = "=2.12.0"
native-tls = "0.2.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
url = "2.5.8"
urlencoding = "2.1.3"

# کتابخانه استاندارد دسترسی به هسته و سیگنال‌های سیستمی لینوکس (POSIX / libc)
# جهت مدیریت طول عمر پردازه‌ها با PR_SET_PDEATHSIG و خاتمه فوری پروسه‌های فرزند
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }