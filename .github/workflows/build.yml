name: Build and Release RedCloud Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libglib2.0-dev liblzma-dev libcap2-bin curl tar zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Rust Bridge Code
        run: flutter_rust_bridge_codegen generate

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Linux Application (Release Mode)
        run: flutter build linux --release

      - name: Download Official Core Binaries (All 4 Upstream Sources)
        run: |
          # ۱. دانلود نسخه دقیق sing-box 1.13.13 لینوکس
          echo "Downloading official sing-box 1.13.13..."
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.13.13/sing-box-1.13.13-linux-amd64.tar.gz -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          mv sing-box-*/sing-box ./
          chmod +x sing-box
          rm -rf singbox.tar.gz sing-box-*

          # ۲. دانلود هسته رسمی Aether MASQUE لینوکس
          echo "Downloading official Aether core..."
          curl -fsSL https://github.com/CluvexStudio/Aether/releases/latest/download/aether-linux-x86_64-musl.tar.gz -o aether.tar.gz
          tar -xzf aether.tar.gz
          chmod +x aether
          rm -f aether.tar.gz

          # ۳. دانلود هسته رسمی Psiphon Core لینوکس
          echo "Downloading official Psiphon Core..."
          curl -fsSL https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/linux/psiphon-tunnel-core-x86_64 -o psiphon-tunnel-core
          chmod +x psiphon-tunnel-core

          # ۴. دانلود هسته رسمی Tor Expert Bundle لینوکس همراه با GeoIP
          echo "Downloading official Tor Expert Bundle for Linux..."
          curl -fsSL https://archive.torproject.org/tor-package-archive/torbrowser/14.0.8/tor-expert-bundle-linux-x86_64-14.0.8.tar.gz -o tor.tar.gz
          tar -xzf tor.tar.gz
          mv tor/tor ./tor
          [ -f tor/geoip ] && mv tor/geoip ./geoip || true
          [ -f tor/geoip6 ] && mv tor/geoip6 ./geoip6 || true
          chmod +x tor
          rm -rf tor.tar.gz tor/

      - name: Package Linux Archive with Auto-Installer
        run: |
          mkdir -p package/redcloud
          
          # کپی فایل‌های اجرایی فلاتر
          cp -r build/linux/x64/release/bundle/* package/redcloud/
          
          # کپی تمامی ۴ هسته باینری لینوکس
          cp sing-box package/redcloud/
          cp aether package/redcloud/
          cp psiphon-tunnel-core package/redcloud/
          cp tor package/redcloud/
          
          # کپی دیتابیس‌های GeoIP و فایل‌های متنی
          [ -f geoip ] && cp geoip package/redcloud/ || true
          [ -f geoip6 ] && cp geoip6 package/redcloud/ || true
          [ -f cloudflare_IPs.txt ] && cp cloudflare_IPs.txt package/redcloud/ || true
          [ -f DNS.txt ] && cp DNS.txt package/redcloud/ || true

          # ساخت اسکریپت نصب اختصاصی با تنظیم دسترسی‌ها
          cat << 'EOF' > package/redcloud/install.sh
          #!/usr/bin/env bash
          set -e

          if [ "$EUID" -ne 0 ]; then
            echo -e "\e[31m[!] لطفاً این اسکریپت را با دسترسی روت اجرا کنید: sudo ./install.sh\e[0m"
            exit 1
          fi

          echo "🚀 در حال نصب RedCloud VPN و تنظیم دسترسی‌های سیستمی..."
          INSTALL_DIR="/opt/redcloud"
          mkdir -p "$INSTALL_DIR"
          cp -r ./* "$INSTALL_DIR/"

          # اعطای دسترسی اجرایی به کلیه هسته‌ها
          chmod +x "$INSTALL_DIR/client" "$INSTALL_DIR/sing-box" "$INSTALL_DIR/aether" "$INSTALL_DIR/psiphon-tunnel-core" "$INSTALL_DIR/tor" 2>/dev/null || true

          # تنظیم قابلیت‌های دائمی کرنل برای کارت شبکه مجازی TUN
          if command -v setcap >/dev/null 2>&1; then
              setcap cap_net_admin,cap_net_bind_service=+ep "$INSTALL_DIR/sing-box" 2>/dev/null || true
              setcap cap_net_admin,cap_net_bind_service=+ep "$INSTALL_DIR/aether" 2>/dev/null || true
              setcap cap_net_admin,cap_net_bind_service=+ep "$INSTALL_DIR/client" 2>/dev/null || true
          fi

          # ساخت دستور سراسری در ترمینال
          cat << 'IN_EOF' > /usr/local/bin/redcloud
          #!/usr/bin/env bash
          cd /opt/redcloud
          exec ./client "$@"
          IN_EOF
          chmod +x /usr/local/bin/redcloud

          # ساخت فایل دسکتاپ و منو
          cat << IN_EOF > /usr/share/applications/redcloud.desktop
          [Desktop Entry]
          Name=RedCloud VPN
          Comment=Next-Gen Anti-Censorship Client for Linux
          Exec=/usr/local/bin/redcloud
          Icon=/opt/redcloud/data/flutter_assets/assets/app_icon.png
          Terminal=false
          Type=Application
          Categories=Network;Security;VPN;
          StartupWMClass=client
          IN_EOF
          chmod 644 /usr/share/applications/redcloud.desktop

          # شورت‌کات دسکتاپ
          REAL_USER="${SUDO_USER:-$USER}"
          USER_HOME=$(getent passwd "$REAL_USER" | cut -d: -f6)
          if [ -d "$USER_HOME/Desktop" ]; then
            cp /usr/share/applications/redcloud.desktop "$USER_HOME/Desktop/"
            chown "$REAL_USER:$REAL_USER" "$USER_HOME/Desktop/redcloud.desktop"
            chmod +x "$USER_HOME/Desktop/redcloud.desktop"
          fi

          echo "====================================================="
          echo "✅ نصب با موفقیت پایان یافت!"
          echo "• دستور اجرای مستقیم در ترمینال: redcloud"
          echo "• یا کلیک روی آیکون برنامه در منو / دسکتاپ"
          echo "====================================================="
          EOF

          chmod +x package/redcloud/install.sh
          
          # ساخت تک فایل ZIP
          cd package
          zip -r ../RedCloud-Linux-x86_64.zip redcloud/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RedCloud VPN Linux v3.5"
          body: |
            نسخه اختصاصی لینوکس کلاینت ضدسانسور **RedCloud VPN (v3.5)**.
            
            ### 📦 محتویات این پکیج:
            - فایل اجرایی RedCloud مخصوص تمامی توزیع‌های لینوکس (Kali, BlackArch, Debian, Ubuntu, Arch, Fedora)
            - **هسته رسمی Sing-box نسخه 1.13.13**
            - **هسته رسمی Aether MASQUE (HTTP/3 QUIC)**
            - **هسته رسمی Tor Expert Bundle به همراه دیتابیس‌های GeoIP**
            - **هسته رسمی Psiphon Tunnel Core**
            - اسکریپت خودکار `install.sh` جهت تنظیم دسترسی‌های دائمی TUN و ساخت دستور ترمینال `redcloud`
            
            ### 💻 نحوه نصب و استفاده:
            ```bash
            unzip RedCloud-Linux-x86_64.zip
            cd redcloud && sudo ./install.sh
            ```
            سپس فقط کافیست بنویسید: `redcloud`
          draft: false
          prerelease: false
          files: RedCloud-Linux-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}