name: Build and Release RedCloud VPN

on:
  push:
    branches: [ "main" ] # اجرا به محض ثبت کدهای جدید در گیت‌هاب
  workflow_dispatch: # اجازه اجرای دستی بیلد از داخل زبانه Actions گیت‌هاب

permissions:
  contents: write # دسترسی برای اجازه دادن به گیت‌هاب جهت ساخت ریلیز و آپلود فایل‌ها

jobs:
  build:
    runs-on: windows-latest # استفاده از سرور ویندوز گیت‌هاب

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: Build Windows Application (Release Mode)
      run: flutter build windows --release

    - name: Download Official Core Binaries (Secure & Untouched)
      shell: pwsh
      run: |
        # ایجاد پوشه مقصد برای باینری‌ها
        New-Item -ItemType Directory -Force -Path build\windows\x64\runner\Release

        # ۱. دانلود نسخه رسمی sing-box مستقیم از ریپازیتوری SagerNet
        Write-Host "Downloading official sing-box..."
        Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.13.12/sing-box-1.13.12-windows-amd64.zip" -OutFile "sing-box.zip"
        Expand-Archive -Path "sing-box.zip" -DestinationPath "temp-singbox" -Force
        Copy-Item "temp-singbox\sing-box-1.13.12-windows-amd64\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box.exe" -Force

        # ۲. دانلود نسخه رسمی wintun.dll مستقیم از سرور wintun.net (حیاتی برای TUN Mode)
        Write-Host "Downloading official wintun.dll..."
        Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
        Expand-Archive -Path "wintun.zip" -DestinationPath "temp-wintun" -Force
        Copy-Item "temp-wintun\wintun\bin\amd64\wintun.dll" -Destination "build\windows\x64\runner\Release\wintun.dll" -Force

        # ۳. دانلود نسخه رسمی Tor (Expert Bundle) مستقیم از آرشیو رسمی Tor Project
        Write-Host "Downloading official Tor..."
        Invoke-WebRequest -Uri "https://archive.torproject.org/tor-package-archive/torbrowser/14.0.8/tor-expert-bundle-windows-x86_64-14.0.8.tar.gz" -OutFile "tor.tar.gz"
        tar -xzf "tor.tar.gz" -C "."
        Copy-Item "tor\tor.exe" -Destination "build\windows\x64\runner\Release\tor.exe" -Force

        # ۴. دانلود نسخه رسمی ویندوز سایفون و نام‌گذاری مناسب آن
        Write-Host "Downloading official Psiphon Core..."
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/windows/psiphon-tunnel-core-i686.exe" -OutFile "build\windows\x64\runner\Release\psiphon-tunnel-core.exe"

    - name: Compile Installer with Inno Setup
      run: |
        iscc installer.iss

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest # تگ ثابت برای اینکه همیشه جدیدترین نسخه ریلیز را اوررایت کند
        name: "RedCloud VPN Latest Release"
        body: |
          این یک نسخهٔ انتشاریافتهٔ خودکار از آخرین بیلد کدهای شما در ویندوز است.
          
          **تغییرات این نسخه:**
          - فعال‌سازی کارت شبکه مجازی (TUN Mode) سیستمی
          - نمایش زنده و واقعی سرعت آپلود و دانلود
          - ویرایشگر پیشرفته کانفیگ‌های ویتوری
          - پایش موازی پینگ و مرتب‌سازی هوشمند سرورها
          
          *تمامی کدهای باینری هسته‌ها (sing-box, Tor, Psiphon, Wintun) به طور خودکار و مستقیم از مخازن مرجع و امضاشدهٔ کمپانی‌های سازنده دانلود و بسته‌بندی شده‌اند.*
        draft: false
        prerelease: false
        files: |
          RedCloud_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
